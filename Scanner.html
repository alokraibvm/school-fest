<!doctype html>
<html>
  <head>
    <base target="_top">
    <?!= include('Styles'); ?>
    <script src="https://unpkg.com/html5-qrcode" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div class="brand-lockup">
          <div class="school-logo" aria-hidden="true">
            <span>SF</span>
          </div>
          <div>
            <p class="eyebrow"><?= schoolName ?></p>
            <h1>Parent QR Scanner</h1>
          </div>
        </div>
        <a class="icon-link" href="<?= appUrl ?>?page=admin" aria-label="Open admin dashboard">Admin</a>
      </section>

      <section class="scan-layout">
        <div class="scanner-panel">
          <div class="help-panel">
            <p class="eyebrow">Recommended gate method</p>
            <p>Use the phone Camera app to scan the parent's QR. It opens this page with the pass loaded, then tap Mark entry.</p>
          </div>
          <div id="reader"></div>
          <div class="scan-actions">
            <button id="startBtn" class="primary">Start camera</button>
            <button id="stopBtn" class="secondary" disabled>Stop</button>
          </div>
          <div class="upload-row">
            <label for="qrFile">Take or upload QR photo</label>
            <input id="qrFile" type="file" accept="image/*" capture="environment">
          </div>
        </div>

        <div class="verification-panel">
          <div id="statusCard" class="status-card idle">
            <p class="eyebrow">Status</p>
            <h2>Ready to scan</h2>
            <p>Open a QR link, upload a QR image, or enter the Pass ID manually.</p>
          </div>

          <form id="manualForm" class="manual-form">
            <label for="manualCode">Pass ID or QR token</label>
            <div class="input-row">
              <input id="manualCode" name="manualCode" autocomplete="off" placeholder="AF-2026-00001">
              <button class="secondary" type="submit">Check</button>
            </div>
          </form>

          <div id="details" class="details hidden"></div>
          <button id="markBtn" class="primary full" disabled>Mark entry</button>
        </div>
      </section>
    </main>

    <?!= include('JavaScript'); ?>
    <script>
      window.initialToken = new URLSearchParams(location.search).get('token') || '';
      window.addEventListener('load', () => initScannerPage());
    </script>
  </body>
</html>
